[package]
name = "swap-escrow-v2"
description = "Escrow swap contract for TON: NFT, GRAM and Jetton deposits with auto-execution"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[toolchain]
acton = "1.2.0"

[contracts.SwapEscrow]
display-name = "SwapEscrow"
src = "contracts/escrow_beta_v1.tolk"
depends = []

[contracts.SwapEscrowNosup]
display-name = "SwapEscrowNosup"
src = "contracts/escrow_nosup_beta_v1.tolk"
depends = []

[contracts.NftItemMock]
display-name = "NftItemMock"
src = "contracts/nft_item_mock.tolk"
depends = []

[contracts.JettonWalletMock]
display-name = "JettonWalletMock"
src = "contracts/jetton_wallet_mock.tolk"
depends = []

[contracts.JettonMinterMock]
display-name = "JettonMinterMock"
src = "contracts/jetton_minter_mock.tolk"
depends = []

[contracts.NftItemGasMock]
display-name = "NftItemGasMock"
src = "contracts/nft_item_gas_mock.tolk"
depends = []

[lint.rules]
# The codebase consistently uses the inline `createMessage(...).send(...)` form
# in 19 places. Rewriting them would alter contract bodies for style alone
# while the contract is under live testnet testing.
create-message-inline-send = "allow"

# `ton()` is kept as the standard-library alias of `grams()`. Rewriting the
# calls would touch the deployed contract's source for naming alone.
prefer-grams = "allow"

[test]

[fmt]
width = 100
# Acton 1.2.0 changed the wrapping indent for continued binary expressions.
# These pre-existing files are excluded instead of being reformatted, since
# doing so would touch protected contract/test/script sources for style alone.
ignore = [
    "contracts/escrow_beta_v1.tolk",
    "tests/escrow_helpers.tolk",
    "tests/fuzz_invariants.test.tolk",
    "scripts/smoke_mixed_testnet.tolk",
    "scripts/smoke_batch_testnet.tolk",
    "scripts/gen_ts_fixtures.tolk",
    "scripts/smoke_supervisor_testnet.tolk",
]

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "gen"
tests = "tests"
wrappers = "wrappers"

# Check full Acton.toml reference and all available keys:
# https://ton-blockchain.github.io/acton/docs/acton-toml
