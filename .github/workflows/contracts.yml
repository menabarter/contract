name: Contracts

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0

      - name: Build
        run: acton build

      - name: Formatter
        run: acton fmt --check

      - name: Linter
        run: acton check --output-format github

      - name: Test
        run: acton test

      # The TypeScript layer checks the generated wrapper against cell-hash
      # fixtures produced on the Tolk side, and asserts that the bytecode the
      # wrapper embeds matches the current build. Without it a contract change
      # that skips `acton wrapper --ts` leaves the wrapper pinned to stale
      # bytecode, and every address derived from it is wrong.
      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      - name: Install TypeScript dependencies
        run: npm install

      - name: Typecheck TypeScript wrapper
        run: npm run typecheck

      - name: Test TypeScript wrapper
        run: npm test
